<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du Champ d'Hévéas</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, rgba(34, 139, 34, 0.1) 0%, rgba(154, 205, 50, 0.1) 100%),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M20,50 Q30,30 40,50 T60,50 Q70,70 80,50" fill="none" stroke="rgba(34,139,34,0.05)" stroke-width="2"/><ellipse cx="50" cy="80" rx="15" ry="8" fill="rgba(139,69,19,0.05)"/></svg>');
            background-size: cover, 200px 200px;
            background-attachment: fixed;
        }
        input[type="number"] {
            -moz-appearance: textfield;
            font-size: 16px;
            min-height: 44px;
            padding: 10px;
        }
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="date"] {
            font-size: 16px;
            min-height: 44px;
            padding: 10px;
        }
        input, select {
            font-size: 16px;
            min-height: 44px;
        }
        .rubber-tree-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(34,139,34,0.02) 10px, rgba(34,139,34,0.02) 20px);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('production');
            const [productions, setProductions] = useState([]);
            const [depenses, setDepenses] = useState([]);
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear());

            const formatNumber = (num) => {
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
            };

            useEffect(() => {
                const savedProductions = localStorage.getItem('productions');
                const savedDepenses = localStorage.getItem('depenses');
                
                if (savedProductions) setProductions(JSON.parse(savedProductions));
                if (savedDepenses) setDepenses(JSON.parse(savedDepenses));
            }, []);

            useEffect(() => {
                localStorage.setItem('productions', JSON.stringify(productions));
            }, [productions]);

            useEffect(() => {
                localStorage.setItem('depenses', JSON.stringify(depenses));
            }, [depenses]);

            const moisFr = ['Janvier', 'Fevrier', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Aout', 'Septembre', 'Octobre', 'Novembre', 'Decembre'];

            const getMonthYear = (dateStr) => {
                if (!dateStr) return { mois: 'janvier', annee: 1900 };
                const date = new Date(dateStr);
                return {
                    mois: moisFr[date.getMonth()],
                    annee: date.getFullYear()
                };
            };

            const addProduction = () => {
                setProductions([...productions, {
                    id: Date.now(),
                    date: '',
                    poidsMaman: 0,
                    poidsPapa: 0,
                    prixKg: 0
                }]);
            };

            const updateProduction = (id, field, value) => {
                setProductions(productions.map(p => 
                    p.id === id ? { ...p, [field]: value } : p
                ));
            };

            const deleteProduction = (id) => {
                if (confirm('Êtes-vous sûr de vouloir supprimer cette production ?')) {
                    setProductions(productions.filter(p => p.id !== id));
                }
            };

            const addDepense = () => {
                setDepenses([...depenses, {
                    id: Date.now(),
                    date: '',
                    beneficiaire: 'Papa',
                    type: '',
                    montant: 0
                }]);
            };

            const updateDepense = (id, field, value) => {
                setDepenses(depenses.map(d => 
                    d.id === id ? { ...d, [field]: value } : d
                ));
            };

            const deleteDepense = (id) => {
                if (confirm('Êtes-vous sûr de vouloir supprimer cette dépense ?')) {
                    setDepenses(depenses.filter(d => d.id !== id));
                }
            };

            const calculateBilan = (beneficiaire) => {
                const moisAvecDonnees = new Set();
                
                productions.forEach(p => {
                    const { mois, annee } = getMonthYear(p.date);
                    if (annee === selectedYear && p.date) {
                        moisAvecDonnees.add(mois);
                    }
                });
                
                depenses.forEach(d => {
                    const { mois, annee } = getMonthYear(d.date);
                    if (d.beneficiaire === beneficiaire && annee === selectedYear && d.date) {
                        moisAvecDonnees.add(mois);
                    }
                });
                
                const moisFiltres = moisFr.filter(mois => moisAvecDonnees.has(mois));
                
                const bilan = moisFiltres.map(mois => {
                    const ventes = productions
                        .filter(p => {
                            const { mois: pMois, annee } = getMonthYear(p.date);
                            return pMois === mois && annee === selectedYear;
                        })
                        .reduce((sum, p) => {
                            const poids = beneficiaire === 'Maman' ? parseFloat(p.poidsMaman) || 0 : parseFloat(p.poidsPapa) || 0;
                            const prix = parseFloat(p.prixKg) || 0;
                            return sum + (poids * prix);
                        }, 0);

                    const depensesTotal = depenses
                        .filter(d => {
                            const { mois: dMois, annee } = getMonthYear(d.date);
                            return d.beneficiaire === beneficiaire && dMois === mois && annee === selectedYear;
                        })
                        .reduce((sum, d) => sum + (parseFloat(d.montant) || 0), 0);

                    return {
                        mois,
                        ventes: ventes.toFixed(2),
                        depenses: depensesTotal.toFixed(2),
                        resultat: (ventes - depensesTotal).toFixed(2)
                    };
                });

                return bilan;
            };

            const ProductionTab = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">Saisie Production & Pesée</h2>
                        <button onClick={addProduction} className="flex items-center gap-2 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">
                            ➕ Nouvelle Production
                        </button>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full bg-white shadow-md rounded-lg">
                            <thead className="bg-gray-100">
                                <tr>
                                    <th className="px-4 py-3 text-left">Date</th>
                                    <th className="px-4 py-3 text-left">Mois</th>
                                    <th className="px-4 py-3 text-left">Année</th>
                                    <th className="px-4 py-3 text-right">Poids Maman (kg)</th>
                                    <th className="px-4 py-3 text-right">Poids Papa (kg)</th>
                                    <th className="px-4 py-3 text-right">Prix/kg</th>
                                    <th className="px-4 py-3 text-right">Montant Maman</th>
                                    <th className="px-4 py-3 text-right">Montant Papa</th>
                                    <th className="px-4 py-3"></th>
                                </tr>
                            </thead>
                            <tbody>
                                {productions.map((p) => {
                                    const { mois, annee } = getMonthYear(p.date);
                                    const montantMaman = Math.round((parseFloat(p.poidsMaman) || 0) * (parseFloat(p.prixKg) || 0));
                                    const montantPapa = Math.round((parseFloat(p.poidsPapa) || 0) * (parseFloat(p.prixKg) || 0));
                                    
                                    return (
                                        <tr key={p.id} className="border-t hover:bg-gray-50">
                                            <td className="px-4 py-3">
                                                <input type="date" value={p.date} onChange={(e) => updateProduction(p.id, 'date', e.target.value)} className="border rounded px-2 py-1 w-full" />
                                            </td>
                                            <td className="px-4 py-3 text-gray-600">{mois}</td>
                                            <td className="px-4 py-3 text-gray-600">{annee}</td>
                                            <td className="px-4 py-3">
                                                <input type="number" inputMode="numeric" value={p.poidsMaman} onChange={(e) => updateProduction(p.id, 'poidsMaman', e.target.value)} className="border rounded px-3 py-2 w-full text-right text-lg" />
                                            </td>
                                            <td className="px-4 py-3">
                                                <input type="number" inputMode="numeric" value={p.poidsPapa} onChange={(e) => updateProduction(p.id, 'poidsPapa', e.target.value)} className="border rounded px-3 py-2 w-full text-right text-lg" />
                                            </td>
                                            <td className="px-4 py-3">
                                                <input type="number" inputMode="numeric" value={p.prixKg} onChange={(e) => updateProduction(p.id, 'prixKg', e.target.value)} className="border rounded px-3 py-2 w-full text-right text-lg" />
                                            </td>
                                            <td className="px-4 py-3 text-right font-semibold text-blue-600 text-lg">{montantMaman} FCFA</td>
                                            <td className="px-4 py-3 text-right font-semibold text-green-600 text-lg">{montantPapa} FCFA</td>
                                            <td className="px-4 py-3">
                                                <button onClick={() => deleteProduction(p.id)} className="text-red-500 hover:text-red-700">
                                                    🗑️
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const DepensesTab = () => (
                <div className="space-y-4">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800">Gestion des Dépenses</h2>
                        <button onClick={addDepense} className="flex items-center gap-2 bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">
                            ➕ Nouvelle Dépense
                        </button>
                    </div>

                    <div className="overflow-x-auto">
                        <table className="w-full bg-white shadow-md rounded-lg">
                            <thead className="bg-gray-100">
                                <tr>
                                    <th className="px-4 py-3 text-left">Date</th>
                                    <th className="px-4 py-3 text-left">Bénéficiaire</th>
                                    <th className="px-4 py-3 text-left">Type dépense</th>
                                    <th className="px-4 py-3 text-right">Montant</th>
                                    <th className="px-4 py-3"></th>
                                </tr>
                            </thead>
                            <tbody>
                                {depenses.map((d) => {
                                    return (
                                        <tr key={d.id} className="border-t hover:bg-gray-50">
                                            <td className="px-4 py-3">
                                                <input type="date" value={d.date} onChange={(e) => updateDepense(d.id, 'date', e.target.value)} className="border rounded px-2 py-1 w-full" />
                                            </td>
                                            <td className="px-4 py-3">
                                                <select value={d.beneficiaire} onChange={(e) => updateDepense(d.id, 'beneficiaire', e.target.value)} className="border rounded px-2 py-1 w-full">
                                                    <option value="Maman">Maman</option>
                                                    <option value="Papa">Papa</option>
                                                </select>
                                            </td>
                                            <td className="px-4 py-3">
                                                <input type="text" value={d.type} onChange={(e) => updateDepense(d.id, 'type', e.target.value)} className="border rounded px-2 py-1 w-full" placeholder="Ex: Engrais, Main d'oeuvre..." />
                                            </td>
                                            <td className="px-4 py-3">
                                                <input type="number" inputMode="numeric" value={d.montant} onChange={(e) => updateDepense(d.id, 'montant', e.target.value)} className="border rounded px-3 py-2 w-full text-right text-lg" />
                                            </td>
                                            <td className="px-4 py-3">
                                                <button onClick={() => deleteDepense(d.id)} className="text-red-500 hover:text-red-700">
                                                    🗑️
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );

            const BilanTab = () => {
                const bilanMaman = calculateBilan('Maman');
                const bilanPapa = calculateBilan('Papa');

                return (
                    <div className="space-y-6">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Bilans Mensuels</h2>
                            <div className="flex items-center gap-2">
                                <span>📅</span>
                                <select value={selectedYear} onChange={(e) => setSelectedYear(parseInt(e.target.value))} className="border rounded px-3 py-2">
                                    {[2023, 2024, 2025, 2026, 2027].map(year => (
                                        <option key={year} value={year}>{year}</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6">
                            <div className="bg-white shadow-lg rounded-lg p-6">
                                <h3 className="text-xl font-bold text-blue-600 mb-4">Bilan Mensuel Maman</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className="bg-blue-50">
                                            <tr>
                                                <th className="px-3 py-2 text-left">Mois</th>
                                                <th className="px-3 py-2 text-right">Ventes</th>
                                                <th className="px-3 py-2 text-right">Dépenses</th>
                                                <th className="px-3 py-2 text-right">Résultat</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {bilanMaman.length === 0 ? (
                                                <tr>
                                                    <td colSpan="4" className="px-3 py-6 text-center text-gray-500">
                                                        Aucune donnée pour {selectedYear}
                                                    </td>
                                                </tr>
                                            ) : (
                                                <>
                                                    {bilanMaman.map((b, idx) => (
                                                        <tr key={idx} className="border-t">
                                                            <td className="px-3 py-2">{b.mois}</td>
                                                            <td className="px-3 py-2 text-right text-green-600">{b.ventes} FCFA</td>
                                                            <td className="px-3 py-2 text-right text-red-600">{b.depenses} FCFA</td>
                                                            <td className={`px-3 py-2 text-right font-semibold ${parseFloat(b.resultat) >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                                {b.resultat} FCFA
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    <tr className="border-t-2 font-bold bg-blue-50">
                                                        <td className="px-3 py-2">TOTAL</td>
                                                        <td className="px-3 py-2 text-right text-green-600">
                                                            {bilanMaman.reduce((sum, b) => sum + parseFloat(b.ventes), 0).toFixed(2)} FCFA
                                                        </td>
                                                        <td className="px-3 py-2 text-right text-red-600">
                                                            {bilanMaman.reduce((sum, b) => sum + parseFloat(b.depenses), 0).toFixed(2)} FCFA
                                                        </td>
                                                        <td className="px-3 py-2 text-right">
                                                            {bilanMaman.reduce((sum, b) => sum + parseFloat(b.resultat), 0).toFixed(2)} FCFA
                                                        </td>
                                                    </tr>
                                                </>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="bg-white shadow-lg rounded-lg p-6">
                                <h3 className="text-xl font-bold text-green-600 mb-4">Bilan Mensuel Papa</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className="bg-green-50">
                                            <tr>
                                                <th className="px-3 py-2 text-left">Mois</th>
                                                <th className="px-3 py-2 text-right">Ventes</th>
                                                <th className="px-3 py-2 text-right">Dépenses</th>
                                                <th className="px-3 py-2 text-right">Résultat</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {bilanPapa.length === 0 ? (
                                                <tr>
                                                    <td colSpan="4" className="px-3 py-6 text-center text-gray-500">
                                                        Aucune donnée pour {selectedYear}
                                                    </td>
                                                </tr>
                                            ) : (
                                                <>
                                                    {bilanPapa.map((b, idx) => (
                                                        <tr key={idx} className="border-t">
                                                            <td className="px-3 py-2">{b.mois}</td>
                                                            <td className="px-3 py-2 text-right text-green-600">{b.ventes} FCFA</td>
                                                            <td className="px-3 py-2 text-right text-red-600">{b.depenses} FCFA</td>
                                                            <td className={`px-3 py-2 text-right font-semibold ${parseFloat(b.resultat) >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                                {b.resultat} FCFA
                                                            </td>
                                                        </tr>
                                                    ))}
                                                    <tr className="border-t-2 font-bold bg-green-50">
                                                        <td className="px-3 py-2">TOTAL</td>
                                                        <td className="px-3 py-2 text-right text-green-600">
                                                            {bilanPapa.reduce((sum, b) => sum + parseFloat(b.ventes), 0).toFixed(2)} FCFA
                                                        </td>
                                                        <td className="px-3 py-2 text-right text-red-600">
                                                            {bilanPapa.reduce((sum, b) => sum + parseFloat(b.depenses), 0).toFixed(2)} FCFA
                                                        </td>
                                                        <td className="px-3 py-2 text-right">
                                                            {bilanPapa.reduce((sum, b) => sum + parseFloat(b.resultat), 0).toFixed(2)} FCFA
                                                        </td>
                                                    </tr>
                                                </>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6 mt-6">
                            <div className="bg-gradient-to-br from-blue-50 to-blue-100 shadow-lg rounded-lg p-6">
                                <h3 className="text-xl font-bold text-blue-700 mb-4">Bilan Annuel Maman - {selectedYear}</h3>
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center bg-white rounded p-3">
                                        <span className="font-semibold text-gray-700">Total ventes</span>
                                        <span className="text-xl font-bold text-green-600">
                                            {bilanMaman.reduce((sum, b) => sum + parseFloat(b.ventes), 0).toFixed(2)} FCFA
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center bg-white rounded p-3">
                                        <span className="font-semibold text-gray-700">Total dépenses</span>
                                        <span className="text-xl font-bold text-red-600">
                                            {bilanMaman.reduce((sum, b) => sum + parseFloat(b.depenses), 0).toFixed(2)} FCFA
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center bg-blue-600 text-white rounded p-3">
                                        <span className="font-bold">Résultat</span>
                                        <span className="text-2xl font-bold">
                                            {bilanMaman.reduce((sum, b) => sum + parseFloat(b.resultat), 0).toFixed(2)} FCFA
                                        </span>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-gradient-to-br from-green-50 to-green-100 shadow-lg rounded-lg p-6">
                                <h3 className="text-xl font-bold text-green-700 mb-4">Bilan Annuel Papa - {selectedYear}</h3>
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center bg-white rounded p-3">
                                        <span className="font-semibold text-gray-700">Total ventes</span>
                                        <span className="text-xl font-bold text-green-600">
                                            {bilanPapa.reduce((sum, b) => sum + parseFloat(b.ventes), 0).toFixed(2)} FCFA
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center bg-white rounded p-3">
                                        <span className="font-semibold text-gray-700">Total dépenses</span>
                                        <span className="text-xl font-bold text-red-600">
                                            {bilanPapa.reduce((sum, b) => sum + parseFloat(b.depenses), 0).toFixed(2)} FCFA
                                        </span>
                                    </div>
                                    <div className="flex justify-between items-center bg-green-600 text-white rounded p-3">
                                        <span className="font-bold">Résultat</span>
                                        <span className="text-2xl font-bold">
                                            {bilanPapa.reduce((sum, b) => sum + parseFloat(b.resultat), 0).toFixed(2)} FCFA
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-gradient-to-br from-purple-50 to-purple-100 shadow-xl rounded-lg p-6 mt-6">
                            <h3 className="text-2xl font-bold text-purple-700 mb-4">Bilan Général (Maman + Papa) - {selectedYear}</h3>
                            <div className="grid md:grid-cols-3 gap-4">
                                <div className="bg-white rounded-lg p-4 text-center">
                                    <p className="text-gray-600 font-semibold mb-2">Total ventes combinées</p>
                                    <p className="text-3xl font-bold text-green-600">
                                        {(bilanMaman.reduce((sum, b) => sum + parseFloat(b.ventes), 0) + 
                                          bilanPapa.reduce((sum, b) => sum + parseFloat(b.ventes), 0)).toFixed(2)} FCFA
                                    </p>
                                </div>
                                <div className="bg-white rounded-lg p-4 text-center">
                                    <p className="text-gray-600 font-semibold mb-2">Total dépenses combinées</p>
                                    <p className="text-3xl font-bold text-red-600">
                                        {(bilanMaman.reduce((sum, b) => sum + parseFloat(b.depenses), 0) + 
                                          bilanPapa.reduce((sum, b) => sum + parseFloat(b.depenses), 0)).toFixed(2)} FCFA
                                    </p>
                                </div>
                                <div className="bg-purple-600 text-white rounded-lg p-4 text-center">
                                    <p className="font-semibold mb-2">Résultat global</p>
                                    <p className="text-3xl font-bold">
                                        {(bilanMaman.reduce((sum, b) => sum + parseFloat(b.resultat), 0) + 
                                          bilanPapa.reduce((sum, b) => sum + parseFloat(b.resultat), 0)).toFixed(2)} FCFA
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-lg shadow-xl p-6 mb-6 rubber-tree-pattern">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">🌳 Gestion du Champ d'Hévéas</h1>
                            <p className="text-gray-600">Suivi des productions et des dépenses - Maman & Papa</p>
                        </div>

                        <div className="bg-white rounded-lg shadow-xl overflow-hidden">
                            <div className="flex border-b">
                                <button onClick={() => setActiveTab('production')} className={`flex-1 py-4 px-6 font-semibold transition ${activeTab === 'production' ? 'bg-green-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                    <div className="flex items-center justify-center gap-2">
                                        📈 Productions
                                    </div>
                                </button>
                                <button onClick={() => setActiveTab('depenses')} className={`flex-1 py-4 px-6 font-semibold transition ${activeTab === 'depenses' ? 'bg-red-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                    <div className="flex items-center justify-center gap-2">
                                        💰 Dépenses
                                    </div>
                                </button>
                                <button onClick={() => setActiveTab('bilan')} className={`flex-1 py-4 px-6 font-semibold transition ${activeTab === 'bilan' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                                    <div className="flex items-center justify-center gap-2">
                                        📊 Bilans
                                    </div>
                                </button>
                            </div>

                            <div className="p-6">
                                {activeTab === 'production' && <ProductionTab />}
                                {activeTab === 'depenses' && <DepensesTab />}
                                {activeTab === 'bilan' && <BilanTab />}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
